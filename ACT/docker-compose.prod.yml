version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: act_db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-atc_monitor}
      MYSQL_USER: ${DB_USER:-atc_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-atc_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: act_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:4.4
    container_name: act_mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  orion:
    image: fiware/orion-ld:latest
    container_name: act_orion
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "1026:1026"
    command: -dbhost mongo -loglevel DEBUG
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.1.0
    container_name: act_emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
      - "18083:18083"
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18.0
    container_name: act_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: act_app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      mongo:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_ENGINE=${DB_ENGINE}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - CHANNEL_LAYER_BACKEND=${CHANNEL_LAYER_BACKEND}
      - CACHE_BACKEND=${CACHE_BACKEND}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - .:/app
    expose:
      - "8000"
    restart: unless-stopped
    command: >
      sh -c "
      python manage.py makemigrations --noinput &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py shell -c \"
      from django.contrib.auth.models import User
      User.objects.filter(is_superuser=True).exclude(username='admin').delete()
      try:
          admin = User.objects.get(username='admin')
          admin.set_password('admin123')
          admin.is_superuser = True
          admin.is_staff = True
          admin.save()
      except User.DoesNotExist:
          User.objects.create_superuser('admin', 'admin@example.com', 'admin123')
      \" &&
      daphne -b 0.0.0.0 -p 8000 atc_monitor.asgi:application
      "

  nginx:
    image: nginx:alpine
    container_name: act_nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./staticfiles:/app/staticfiles
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  neo4j_data: