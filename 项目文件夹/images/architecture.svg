<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">空管设备数据集中分析系统的设计与实现总体架构</text>

  <g font-size="14" fill="#1f2933">
    <!-- L1 -->
    <rect x="90" y="50" width="540" height="42" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="360" y="70" text-anchor="middle" font-weight="600">数据资源层 · CSV / JSON 模拟设备数据（data_resources / generate_data.py）</text>
    <!-- L2 -->
    <rect x="90" y="108" width="540" height="42" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="360" y="128" text-anchor="middle" font-weight="600">数据采集与解析层 · 状态上报接入、清洗与格式转换</text>
    <!-- L3 -->
    <rect x="90" y="166" width="540" height="42" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="360" y="186" text-anchor="middle" font-weight="600">后端服务层 · Django 4.1.5 + DRF（core 通用底座 / monitor 业务模块）</text>
    <!-- L4 -->
    <rect x="90" y="224" width="540" height="42" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="360" y="244" text-anchor="middle" font-weight="600">数据存储层 · Neo4j 知识图谱 + MySQL / SQLite 五库协同存储</text>
    <!-- L5 -->
    <rect x="90" y="282" width="540" height="42" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="360" y="302" text-anchor="middle" font-weight="600">API 接口层 · RESTful API + WebSocket 实时通知（Django Channels）</text>
    <!-- L6 -->
    <rect x="90" y="340" width="540" height="42" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="360" y="360" text-anchor="middle" font-weight="600">前端展示层 · Vue 3 + Element Plus + ECharts + Three.js（3D 孪生）</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M360 92 L360 106"/><path d="M356 102 L360 108 L364 102"/>
    <path d="M360 150 L360 164"/><path d="M356 160 L360 166 L364 160"/>
    <path d="M360 208 L360 222"/><path d="M356 218 L360 224 L364 218"/>
    <path d="M360 266 L360 280"/><path d="M356 276 L360 282 L364 276"/>
    <path d="M360 324 L360 338"/><path d="M356 334 L360 340 L364 334"/>
  </g>
</svg>
