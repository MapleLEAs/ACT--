<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
  <rect x="0" y="0" width="760" height="200" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">系统数据流向</text>

  <g font-size="12.5" fill="#1f2933" text-anchor="middle">
    <rect x="20" y="70" width="120" height="56" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
