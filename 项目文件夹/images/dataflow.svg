  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M140 98 L168 98"/><path d="M164 94 L168 98 L164 102"/>
    <path d="M290 98 L318 98"/><path d="M314 94 L318 98 L314 102"/>
    <path d="M450 98 L473 98"/><path d="M469 94 L473 98 L469 102"/>
